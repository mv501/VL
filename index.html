<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>💙</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- پس زمینه -->
    <div id="background">

        <div class="gradient"></div>

        <div id="stars"></div>

        <div id="clouds"></div>

        <div id="floatingHearts"></div>

        <div id="butterflies"></div>

    </div>



    <!-- موزیک -->

    <audio id="music">
    <source src="Bishtar Bishtar.mp3" type="audio/mpeg">
    </audio>

    



    <!-- صفحه اصلی -->

    <main id="container">

        <div class="glassCard">

            <h1 id="message">

                هرچی سعی کردم خودم بگم نتونستم...

                <br><br>

                برای همین از عمو حسن کمک گرفتم

            </h1>

        </div>

    </main>



    <!-- متن دوم -->

    <div id="loveMessage">

        دوست دارم خوشگله 🌝💙

    </div>



    <!-- افکت انفجار قلب -->

    <div id="heartExplosion">

</div>

<div id="heartContainer">

</div>



    <!-- اگر مرورگر اجازه پخش خودکار نداد -->

    <div id="startScreen">

        <button id="startButton">

             لمس کن

        </button>

    </div>



    <script src="script.js"></script>

</body>

</html>
